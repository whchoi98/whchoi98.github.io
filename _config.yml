title: whchoi98.github.io
tagline: 클라우드 인프라를 만들고, 측정하고, 기록합니다
description: "AWS Solutions Architect's Tech Blog & Workshop - AIML, Container, AWS Core, Cloud Security, Observability"
baseurl: ""
url: "https://whchoi98.github.io"
author: whchoi98
github_username: whchoi98

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - _design/
  - "*.zip"

# 카테고리 메타: 이름 → 아이콘 / 설명 / 인덱스 경로
blog_categories:
  - name: AIML
    icon: bedrock
    desc: Bedrock, GenAI, Claude Code
    url: /docs/techblog/aiml/
  - name: AWS Core
    icon: lambda
    desc: VPC, EC2, Lambda, S3
    url: /docs/techblog/aws-core/
  - name: Cloud Security
    icon: vpc
    desc: IAM, GuardDuty, WAF
    url: /docs/techblog/cloud-security/
  - name: Container
    icon: eks
    desc: EKS, ECS, Kubernetes
    url: /docs/techblog/container/
  - name: Observability
    icon: cloudwatch
    desc: CloudWatch, OTel, Grafana
    url: /docs/techblog/observability/
  - name: Workshop
    icon: step-functions
    desc: 핸즈온 랩 모음
    url: /docs/workshop/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "docs/techblog"
    values:
      layout: post
      section: techblog
  - scope:
      path: "docs/workshop"
    values:
      layout: doc
      section: workshop
