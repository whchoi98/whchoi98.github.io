<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{% seo %}
<link rel="alternate" type="application/rss+xml" href="{{ '/feed.xml' | absolute_url }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/css/main.css">
<script>
/* 첫 페인트 전에 테마 확정 - 깜빡임 방지 */
(function () {
  var q = null, lq = null;
  try {
    var sp = new URLSearchParams(location.search);
    q = sp.get("theme");
    lq = sp.get("lang");
  } catch (e) {}
  var saved = null, lang = null;
  try { saved = localStorage.getItem("whchoi98-blog-theme"); } catch (e) {}
  try { lang = localStorage.getItem("whchoi98-blog-lang"); } catch (e) {}
  var pick = q || saved;
  var dark = pick ? pick === "dark"
    : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  if (dark) document.documentElement.classList.add("dark");
  if ((lq || lang) === "en") document.documentElement.classList.add("lang-en");
})();
</script>
</head>
<body class="layout-{{ page.layout | default: 'default' }}">
{{ content }}
<footer class="site-footer">
  <div class="wrap footer-row">
    <span class="footer-copy">© 2026 whchoi98 · Built on GitHub Pages</span>
    {% if site.goatcounter %}<span class="view-count" data-views-total data-goat-code="{{ site.goatcounter }}" hidden>· <span class="l-ko">총 조회 <b data-views-n></b>회</span><span class="l-en"><b data-views-n></b> total views</span></span>{% endif %}
    <div class="footer-spacer"></div>
    <a href="https://github.com/whchoi98" target="_blank" rel="noopener">GitHub</a>
    <a href="/feed.xml">RSS</a>
  </div>
</footer>
{% if site.goatcounter %}
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
{% endif %}
<script src="/assets/js/main.js" defer></script>
</body>
</html>
